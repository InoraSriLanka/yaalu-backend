services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      args:
        APP_NAME: api-gateway
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: amqp://rabbitmq:5672
    volumes:
      - uploads_data:/usr/src/app/uploads
    depends_on:
      rabbitmq:
        condition: service_healthy

  auth-service:
    build:
      context: .
      args:
        APP_NAME: auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: amqp://rabbitmq:5672
      SMS_API_TOKEN: ${SMS_API_TOKEN:-7194|zP9yVoY1EiX4zse7ZrE3mV18nBW01KNecSpIIu9Qb6c1349d}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-YaaluApp}
      SMS_ENDPOINT: ${SMS_ENDPOINT:-https://app.text.lk/api/v3/sms/send}
    depends_on:
      rabbitmq:
        condition: service_healthy

  product-service:
    build:
      context: .
      args:
        APP_NAME: product-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  order-service:
    build:
      context: .
      args:
        APP_NAME: order-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  payment-service:
    build:
      context: .
      args:
        APP_NAME: payment-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  delivery-service:
    build:
      context: .
      args:
        APP_NAME: delivery-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: .
      args:
        APP_NAME: notification-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  uploads_data:
