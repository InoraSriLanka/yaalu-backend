services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yaalu_auth
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      args:
        APP_NAME: api-gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  auth-service:
    build:
      context: .
      args:
        APP_NAME: auth-service
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL: 'true'
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: yaalu_auth
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  product-service:
    build:
      context: .
      args:
        APP_NAME: product-service
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL: 'true'
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: yaalu_product
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order-service:
    build:
      context: .
      args:
        APP_NAME: order-service
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL: 'true'
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: yaalu_order
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  delivery-service:
    build:
      context: .
      args:
        APP_NAME: delivery-service
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL: 'true'
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: yaalu_delivery
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
